[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adadeh"
version = "0.1.0"
description = "Purwarupa pemeriksaan indikasi deepfake audio, kompatibel notebook ADADeH."
requires-python = ">=3.11,<3.14"
dependencies = [
  "tensorflow==2.21.0",
  "keras==3.13.2",
  "numpy==2.4.6",
  "scikit-learn==1.9.1",
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchcodec==0.17.0",
  "librosa==0.11.0",
  "streamlit==1.55.0",
  "soundfile==0.14.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "psutil==7.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: memakai model atau decoder nyata", "parity: kesetaraan artefak/notebook", "ui: antarmuka Streamlit"]
